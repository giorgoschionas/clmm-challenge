[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clmm-challenge"
version = "0.1.0"
description = "A minimal standalone concentrated-liquidity strategy challenge"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy==2.4.6", "gymnasium==1.2.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["clmm_challenge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
